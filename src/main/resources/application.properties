spring.application.name=taxraj

# SQLite
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:taxraj.db?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Wymusza uruchomienie pliku data.sql podczas startu aplikacji
spring.sql.init.mode=always

# Niezwykle wa?ne: opó?nia ?adowanie danych, a? Hibernate utworzy struktur? tabel
spring.jpa.defer-datasource-initialization=true

# Port
server.port=${PORT:8080}

