<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(aktywna)" class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon">
      <img th:src="@{/svg/logo.svg}" alt="Logo Tax-Raj" class="logo-svg" />
    </div>
    <span class="brand-name">Tax<span>-Raj</span></span>
  </div>

  <nav class="nav">
    <span class="nav-section">Menu główne</span>

    <a class="nav-item" th:classappend="${aktywna == 'dashboard'} ? 'active'"
       th:href="@{/dashboard}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Panel Główny</span>
    </a>

    <a class="nav-item" th:classappend="${aktywna == 'faktury'} ? 'active'"
       th:href="@{/faktury}">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
      <span>Faktury</span>
    </a>

    <a class="nav-item" th:classappend="${aktywna == 'klienci'} ? 'active'"
       th:href="@{/klienci}">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Klienci</span>
    </a>

    <a class="nav-item" th:classappend="${aktywna == 'kontrahenci'} ? 'active'"
       th:href="@{/kontrahenci}">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span>Kontrahenci</span>
    </a>

    <a class="nav-item" th:classappend="${aktywna == 'deklaracje'} ? 'active'"
       th:href="@{/deklaracje}">
      <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Deklaracje</span>
    </a>

    <a class="nav-item" th:classappend="${aktywna == 'raporty'} ? 'active'"
       th:href="@{/raporty}">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span>Raporty</span>
    </a>

  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar"
           th:text="${zalogowany != null ? zalogowany.imie.substring(0,1) + zalogowany.nazwisko.substring(0,1) : '?'}">AK</div>
      <div class="user-info">
        <div class="user-name"
             th:text="${zalogowany != null ? zalogowany.imie + ' ' + zalogowany.nazwisko : 'Gość'}">Anna Kowalska</div>
        <div class="user-role"
             th:text="${zalogowany != null ? #strings.capitalize(#strings.toLowerCase(zalogowany.rola)) : ''}">Księgowy</div>
      </div>
    </div>

    <form th:action="@{/logout}" method="post" style="margin-top: 8px;">
      <button type="submit" class="logout-btn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Wyloguj się</span>
      </button>
    </form>
  </div>

</aside>

</body>
</html>
